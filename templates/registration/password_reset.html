{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — TaskCollab</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-left">
    <div class="auth-logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
      </svg>
    </div>
    <h1>Forgot Password?</h1>
    <p>Enter the email address linked to your account. We will send you a reset link.</p>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control"
               placeholder="your@email.com" required>
      </div>
      <div class="auth-btns">
        <button type="submit" class="btn btn-primary" style="flex:1;">
          Send Reset Link
        </button>
        <a href="{% url 'login' %}" class="btn btn-outline" style="flex:1;">
          Back to Login
        </a>
      </div>
    </form>
  </div>
  <div class="auth-right">
    <div class="auth-illus">
      <h2>Password Reset</h2>
      <p>We will email you a secure link to reset your password.</p>
    </div>
  </div>
</div>
</body>
</html>
