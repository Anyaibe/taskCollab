{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Sent — TaskCollab</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-left">
    <div class="auth-logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </div>
    <h1>Check Your Email</h1>
    <p>If an account exists with that email address, we have sent a password reset link. Check your inbox and follow the instructions.</p>
    <div style="margin-top:24px;">
      <a href="{% url 'login' %}" class="btn btn-primary btn-full">Back to Login</a>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-illus">
      <h2>Email Sent</h2>
      <p>Check your inbox for the reset link.</p>
    </div>
  </div>
</div>
</body>
</html>
